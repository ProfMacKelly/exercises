:hover{background:#0b4f8f}.secondary{color:#155991;background:#fff;border-color:#c8d7e4}.secondary:hover{background:#f1f7fc}.small{padding:7px 12px;font-size:.86rem}.actions{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid #e0e7ee}.progress{height:8px;border-radius:50px;background:#d8e7f2;overflow:hidden;margin:10px 0 18px}.progress span{display:block;height:100%;background:#1971c2;transition:width .15s}.timeline{padding:0;margin:15px 0;list-style:none}.timeline li{padding:7px 0;border-bottom:1px solid #edf0f4;display:flex;gap:9px}.timeline li::before{content:'•';color:#2472aa}.timeline .current{color:#07599d;font-weight:800}.timeline .done::before{content:'✓';color:#09846e}.micro{font-size:.82rem;color:#506a80}label.field{font-weight:750;color:#193f5e;display:block;margin:15px 0 6px}textarea,input[type=text],select{display:block;font:inherit;border:1px solid #afc1d1;border-radius:10px;padding:12px;width:100%;background:white;color:#172839}textarea{resize:vertical;min-height:110px}textarea:focus,select:focus,input[type=text]:focus{outline:3px solid #9acbfa;outline-offset:1px}.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}.ev-btn{text-align:left;background:#fff;border:1px solid #b7cadb;border-radius:12px;padding:15px}.ev-btn:hover,.ev-btn.active{background:#edf6ff;border-color:#1971b6}.ev-head{

<header class="hero"><div class="case-label">Case study</div><p>A real-case simulation about negligence and business responsibility.</p></header>
<main class="wrap"><div class="grid"><section class="card" id="main" aria-live="polite"></section><aside class="card aside" aria-label="Simulation progress"><div class="side-title">Case file</div><div style="font-weight:800;margin-top:6px;color:#143f68">Retail customer injury</div><div class="progress" aria-label="Progress"><span id="bar"></span></div><div class="micro" id="progressText"></div><ol class="timeline" id="timeline"></ol><div class="panel dark micro">Your answers are kept in this browser tab only. Nothing is sent to a server. Export your analysis before closing the tab.</div></aside></div></main>
<script>
'use strict';
const STAGES=['Assignment','The incident','Investigate the evidence','The duty question','Precautions & causation','Shared responsibility','Change one fact','Issue your decision','The real case'];
const S={stage:0,student:'',a:{fault:'0'},seen:new Set(),evidence:'layout',revealed:false};
const EVIDENCE={
 layout:{name:'The physical layout',facts:[
  'The store sold home-improvement merchandise. Beside a large overhead door was a smaller door labeled “Customer Entrance.”',
  'Two dark-brown concrete posts, about five feet high and three feet apart, stood immediately outside the smaller door. Their apparent purpose was to protect the building from vehicles.',
  'The customer door was about 36 inches wide. There were no windows or transparent panels near it through which an exiting customer could see the posts. The overhead door was closed.']},
 customer:{name:'The customer’s conduct',facts:[
  'The customer entered past the posts, spent about half an hour inside, and purchased a bathroom mirror roughly five feet long and 1½ feet wide.',
  'He carried the mirror vertically, somewhat to the side. A clerk released the exit security lock; the customer then pushed the door with his left shoulder.',
  'The customer testified he was not rushing. He said the mirror obscured his view of the post as he exited. He had been at least vaguely aware of the posts when entering.']},
 employee:{name:'Store practices and prior experience',facts:[
  'An employee testified that between one and fifty customers used that door on a typical day.',
  'The employee had previously seen customers brush against the post, but had not seen anyone injured by striking it before this accident.',
  'The customer testified that he received no sign or other warning about the posts before he exited.']},
 harm:{name:'Injury and mechanism',facts:[
  'As the customer stepped out, the mirror struck a concrete post and then his head and face struck it.',
  'The customer sustained a cut to his cheek, significant vision problems in one eye, and recurring severe headaches.',
]}
};
const el=()=>document.getElementById('main');
const safe=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const a=(k)=>S.a[k]||'';
const opts=(name,options)=>`<div class="options">${options.map(([v,label])=>`<label class="option"><input type="radio" name="${name}" value="${safe(v)}" ${a(name)===v?'checked':''}><span>${label}</span></label>`).join('')}</div>`;
const area=(name,label,place='Support your answer with specific facts from the record.')=>`<label class="field" for="${name}">${label}</label><textarea id="${name}" name="${name}" placeholder="${safe(place)}">${safe(a(name))}</textarea>`;
const select=(name,label,list)=>`<label class="field" for="${name}">${label}</label><select name="${name}" id="${name}"><option value="">Choose one</option>${list.map(([v,l])=>`<option value="${safe(v)}" ${a(name)===v?'selected':''}>${l}</option>`).join('')}</select>`;
function nav(next='Continue'){return `<div class="error" id="error" role="alert"></div><div class="actions"><div>${S.stage>0?'<button class="btn secondary" data-action="back">← Previous stage</button>':''}</div><button class="btn primary" data-action="next">${next} →</button></div>`}
function shell(title,body,next='Continue'){return `<div class="step">Stage ${S.stage+1} of ${STAGES.length}</div><h2 class="stage-title">${title}</h2>${body}${nav(next)}`}
function render(){
 const n=S.stage;let html='';
 if(n===0)html=shell('The Scenario',`<p>You are serving as a legal decision-maker in a negligence case involving an injured customer and a retail store. You will examine the parties’ conduct in stages, decide whether the business had a relevant legal obligation, and evaluate each party’s contribution to the accident.</p><div class="panel"><strong>Ground rules</strong><p style="margin-bottom:0">The factual material is adapted from a real judicial opinion. Some proposed precautions and later what-if questions are <strong>hypotheticals</strong>, not facts found in the real case. Thus, searching for the real opinion at this point will not be helpful.until after you submit your decision.</p></div><label class="field" for="student">Names</label><input type="text" id="student" name="student" maxlength="120" placeholder="Enter your names" value="${safe(S.student)}"><p class="note"></p>`,'Open case file');
 if(n===1)html=shell('A customer is injured',`<p>A department store operates a home-improvement section. A customer purchases a large bathroom mirror and leaves through a door marked <strong>Entrance</strong>.</p><p>Immediately outside the door are concrete posts designed, apparently, to protect the building from vehicles. The mirror and then the customer’s face collide with one of the posts. The customer suffers significant injuries and sues the store for negligence.</p><div class="panel warn"><strong>Do not decide the case yet.</strong> Decide what questions must be asked before assigning responsibility.</div><div class="q">Which question best frames the first legal dispute?</div>${opts('initial',[['only_customer','Was the customer the only person physically able to avoid the collision?'],['risk_scope','Should the store have anticipated a risk to customers leaving with large purchases, even if the posts could ordinarily be seen?'],['any_harm','Does any injury occurring on business property automatically make its owner liable?']])}${area('initialWhy','Explain why you chose that question.','Identify the competing responsibilities.')} `,'Examine the evidence');
 if(n===2){let ev=EVIDENCE[S.evidence];html=shell('Investigation: build the factual record',`<p>There are four evidence folders. Select and review the evidence in each evidence folder before responding to the question at the bottom of the page.</p><div class="evidence-grid">${Object.entries(EVIDENCE).map(([id,e])=>`<button class="ev-btn ${S.evidence===id?'active':''}" data-ev="${id}" aria-pressed="${S.evidence===id}"><span class="ev-head">${e.name}<span class="dot ${S.seen.has(id)?'read':''}">${S.seen.has(id)?'Viewed':'Open'}</span></span></button>`).join('')}</div><div class="fact"><h3>${ev.name}</h3><ul>${ev.facts.map(x=>`<li>${x}</li>`).join('')}</ul></div><p class="micro"><b>Evidence folders examined: ${S.seen.size} of 4. Read all four before proceeding.</p>${area('evidenceNote','The record concerns an actual injury, but the legal dispute is whether and why the retailer should be responsible. Which two facts most strongly support opposite sides of the dispute?','One fact that favors the business and one that favors the customer.')} `,'Consider legal duty');}
 if(n===3)html=shell('The duty question — act as the judge',`<p>The store is obligated to exercise reasonable care toward customers, but its duty is not a guarantee that no one gets hurt. The legal question is whether that obligation <strong>extends to this particular risk</strong>.</p><div class="panel">When analyzing duty, consider whether injury of this type was reasonably foreseeable, the likelihood and seriousness of injury, the burden of precautions, and the consequences of requiring them. The fact that a hazard was visible may matter, but does it end the inquiry?</div><div class="q">Which legal conclusion would you reach on duty?</div>${opts('duty',[['no','No. Because the posts were generally visible, the store owed no duty concerning a collision with them.'],['yes','Yes. The store’s duty of reasonable care could cover foreseeable collisions by customers carrying bulky purchases, despite the posts’ visibility.'],['absolute','Yes. Because the customer was injured on the property, the store was automatically responsible.']])}${area('dutyWhy','Write the strongest reason for your ruling, and address the best argument against it.')} `,'Assess precautions');
 if(n===4)html=shell('Preventing the accident',`<p>You have the evidence. Now distinguish the <strong>existence of a duty</strong> from the factual questions of whether it was violated and whether a violation caused harm.</p><div class="q">Could a factfinder (judge or jury) reasonably conclude the store failed to take appropriate precautions?</div>${opts('breach',[['yes','Yes; under these circumstances, the existing arrangement may have been unreasonably dangerous.'],['no','No; the visible posts and customer’s responsibility were enough.'],['uncertain','The evidence would permit reasonable disagreement.']])}<div class="q">If the store’s precautions were inadequate, did that failure contribute to this particular collision?</div>${opts('causation',[['yes','Yes; a reasonable additional precaution might have prevented this collision.'],['no','No; no reasonable precaution would have mattered.'],['uncertain','The causal effect of possible precautions remains uncertain.']])}${select('storePrec','Which possible store action should be evaluated first? (A proposed precaution, not an established fact.)', [['warning','Provide a conspicuous warning at the inside of the exit'],['marking','Make the posts more conspicuous to departing customers'],['assist','Offer assistance to customers exiting with bulky goods'],['relocate','Relocate or redesign the posts or doorway'],['none','No additional precaution was reasonably required']])}${select('customerPrec','Which customer action merits the closest consideration?',[['look','Pause, look around the carried object, and confirm the exit path'],['ask','Request help transporting the mirror'],['position','Carry or position the mirror differently'],['none','No additional precaution was reasonably required']])}${area('precWhy','Compare the practical difficulty of precautions for each side and explain their expected effectiveness.','Consider inconvenience, accident risk, and who controls the circumstances.')} `,'Compare responsibility');
 if(n===5){const pct=Number(a('fault')||0);const awarded=pct>50?0:Math.round(100000*(100-pct)/100);html=shell('Comparative negligence — act as the jury',`<p><strong>For this allocation exercise only</strong>, assume the store breached a relevant duty, the breach caused the accident, and total proven damages were <strong>$100,000</strong>. This $100,000 is an instructional hypothetical, not the actual case award. Your earlier duty decision remains unchanged.</p><p>Assign fault based on each side’s unreasonable conduct and causal contribution. The percentages must sum to 100%.</p><label class="field" for="fault">Percentage of fault attributable to the customer</label><input class="range" type="range" name="fault" id="fault" min="0" max="100" step="5" value="${pct}"><div class="split"><div class="metric"><small>Customer</small><div class="value" id="pv">${pct}%</div></div><div class="metric"><small>Store</small><div class="value" id="sv">${100-pct}%</div></div></div><div class="finance" style="margin-top:12px"><div class="metric"><small>Hypothetical total damages</small><strong>$100,000</strong></div><div class="metric"><small>Customer’s share</small><strong id="share">${pct}%</strong></div><div class="metric"><small>Recoverable amount*</small><strong id="award">${money(awarded)}</strong></div></div><p class="micro">*Historical classroom rule: subtract the customer’s percentage of fault, but a plaintiff whose share exceeds 50% recovers nothing under the modified comparative-fault rule relevant to the period.</p>${area('faultWhy','Explain your allocation. Why is it not 0% or 100%?','Discuss evidence supporting some fault on each side, or justify an endpoint.')} `,'Try a changed fact');}
 if(n===6){const scenarios=[['warning','Before customers leave, an employee clearly warns them about the post and points to its location.'],['distance','The concrete posts are positioned much farther from the doorway, beyond the ordinary path used by customers leaving with large goods.'],['no_mirror','The customer is not carrying a large purchase and has a clear, unobstructed view while exiting.']];html=shell('Change one fact — separate hypothetical',`<p>Pick <strong>one imagined change</strong> to the record. This is not evidence about what happened. Ask whether it would alter the scope of the store’s duty, its breach, the customer’s negligence, or causation.</p>${opts('variation',scenarios)}${area('variationWhy','Which elements of your analysis change, and which remain the same?','Explain what matters about the altered circumstance.')} `,'Prepare final judgment');}
 if(n===7)html=shell('Commit to a final judgment',`<p>You have evaluated duty, precautions, causation, and comparative negligence. Deliver your final ruling without knowing what the appellate court decided.</p><div class="panel dark"><strong>Your provisional findings</strong><div id="summary"></div></div>${opts('verdict',[['liable','The store can be held liable on the evidence, subject to comparative negligence.'],['not_liable','The store should not be held liable on this record.'],['jury','Duty extends to this risk, but reasonable jurors could dispute breach or causation.']])}${area('finalWhy','State your ruling as a short judicial opinion (4–6 sentences).','Identify duty, whether precautions were reasonable, causation, and any plaintiff negligence.')}`,'Submit and reveal actual case');
 if(n===8){const fp=Number(a('fault')||0);const hypo=fp>50?0:100000*(100-fp)/100;html=`<div class="step">Case revealed · Debrief</div><h2 class="stage-title">Ward v. K Mart Corp.</h2><p><strong>Illinois Supreme Court · 136 Ill. 2d 132, 554 N.E.2d 223 (1990)</strong></p><div class="debrief"><strong>The outcome:</strong> The Illinois Supreme Court held that the store’s duty of reasonable care extended to the foreseeable risk that customers exiting with large purchases might collide with the nearby post. The Court reinstated the jury’s verdict (see below).</div><div class="finance"><div class="metric"><small>Actual total damages</small><strong>$85,000</strong></div><div class="metric"><small>Actual customer fault</small><strong>20%</strong></div><div class="metric"><small>Actual judgment</small><strong>$68,000</strong></div></div><h3>Why the duty question was contested</h3><p>The posts were plainly present when the customer entered, and a store is not an insurer of every customer’s safety. But the Court reasoned that bulky purchases might obstruct a customer’s view or cause a customer to forget a post located immediately outside the designated exit. It also considered the possible burden of a warning or relocation. Whether the store actually satisfied its duty and whether the customer was negligent were properly fact questions.</p><h3>Procedural twist</h3><p>The jury originally found for the customer, assessed $85,000 in damages, and assigned him 20% comparative negligence. The trial court overrode the jury’s verdict and ruled for the store on duty; the intermediate appellate court affirmed. The Illinois Supreme Court reversed those rulings and directed entry of the $68,000 jury judgment.</p><h3>Compare with your decisions</h3><div class="fact"><ul><li><strong>Your duty ruling:</strong> ${safe(dutyText())}</li><li><strong>Your final position:</strong> ${safe(verdictText())}</li><li><strong>Your illustrative customer allocation:</strong> ${fp}% (store: ${100-fp}%).</li><li><strong>Your recovery in the $100,000 hypothetical:</strong> ${money(hypo)}. This is <em>not</em> the actual case award.</li></ul></div><div class="panel"><strong>Discuss:</strong> Is the easiest precaution necessarily the fairest basis for assigning responsibility? Would a warning be enough, or should the store change the doorway? How might the customer’s ordinary attentiveness affect the division of fault without eliminating the store’s duty?</div><p class="source"><strong>Read the judicial opinion:</strong> <a href="https://law.justia.com/cases/illinois/supreme-court/1990/68962-7.html" target="_blank" rel="noopener noreferrer">Ward v. K Mart Corp., 136 Ill. 2d 132 (1990)</a>.</p><p class="note">Facts above are adapted from the opinion. Alternative precautions and the changed-fact stage are exercises; no actual evidence supplies their prices or proves they would have succeeded.</p><div class="actions"><button class="btn secondary" data-action="reset">Restart the simulation</button><button class="btn primary" data-action="export">Export my analysis (.txt)</button></div>`;}
 el().innerHTML=html;const percent=Math.round(n/(STAGES.length-1)*100);document.getElementById('bar').style.width=percent+'%';document.getElementById('progressText').textContent=(n+1)+' / '+STAGES.length+' stages';document.getElementById('timeline').innerHTML=STAGES.map((s,i)=>`<li class="${i===n?'current':i<n?'done':''}">${safe(s)}</li>`).join('');
 if(n===7){document.getElementById('summary').innerHTML=`<ul><li><strong>Duty:</strong> ${safe(dutyText())}</li><li><strong>Breach:</strong> ${safe(breachText())}</li><li><strong>Causation:</strong> ${safe(causeText())}</li><li><strong>Customer's fault:</strong> ${safe(a('fault'))}%</li></ul>`;}
 document.title=(n===8?'Ward v. K Mart — Debrief':'The Mirror and the Exit')+' | Case Simulation';
}
function money(x){return '$'+Math.round(x).toLocaleString('en-US')}
function dutyText(){return ({yes:'Duty may extend to this foreseeable risk',no:'No duty concerning this visible post',absolute:'Automatic responsibility because harm occurred'})[a('duty')]||'Not selected'}
function breachText(){return ({yes:'The store may have failed to use reasonable precautions',no:'Store precautions were adequate',uncertain:'Reasonable disagreement remains'})[a('breach')]||'Not selected'}
function causeText(){return ({yes:'A reasonable precaution could have avoided the collision',no:'Additional precautions would not have mattered',uncertain:'Causation remains debatable'})[a('causation')]||'Not selected'}
function verdictText(){return ({liable:'Store can be held liable, with comparative fault',not_liable:'Store should not be held liable',jury:'Duty exists but breach / causation contestable'})[a('verdict')]||'Not selected'}
function storeStage(){for(const node of el().querySelectorAll('input[type="radio"]:checked,select')){if(node.name)S.a[node.name]=node.value}for(const node of el().querySelectorAll('textarea')){S.a[node.name]=node.value}if(el().querySelector('[name="student"]'))S.student=el().querySelector('[name="student"]').value;}
function validate(){const req={1:['initial','initialWhy'],2:['evidenceNote'],3:['duty','dutyWhy'],4:['breach','causation','storePrec','customerPrec','precWhy'],5:['faultWhy'],6:['variation','variationWhy'],7:['verdict','finalWhy']};if(S.stage===2 && S.seen.size!==4)return 'Please open all four evidence folders before continuing.';for(const field of (req[S.stage]||[])){if(!String(a(field)).trim())return 'Complete the choices and short explanation before proceeding.';if(field.toLowerCase().endsWith('why')&&String(a(field)).trim().length<12)return 'Add a little more reasoning to your written answer.'}return ''}
function download(){const labels={initial:'Initial legal issue',initialWhy:'Reasoning',evidenceNote:'Evidence notes',duty:'Duty ruling',dutyWhy:'Duty analysis',breach:'Store breach',causation:'Causation',storePrec:'Store precaution',customerPrec:'Customer precaution',precWhy:'Preventive measures analysis',fault:'Customer fault (%)',faultWhy:'Comparative negligence reasoning',variation:'Changed fact',variationWhy:'Changed fact analysis',verdict:'Final verdict',finalWhy:'Final judicial opinion'};const lines=['THE MIRROR AND THE EXIT — STUDENT CASE ANALYSIS','Student or group: '+(S.student||'(not provided)'),'Completed on: '+new Date().toLocaleString(),'Underlying decision: Ward v. K Mart Corp., 136 Ill. 2d 132 (Ill. 1990)',''];Object.keys(labels).forEach(k=>{lines.push(labels[k]+':',String(a(k)||'(not provided)'),'')});lines.push('Actual jury result: $85,000 damages, 20% customer fault; final judgment $68,000.','Opinion: https://law.justia.com/cases/illinois/supreme-court/1990/68962-7.html');const blob=new Blob([lines.join('\r\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='mirror-exit-case-analysis.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',event=>{const eb=event.target.closest('[data-ev]');if(eb){storeStage();S.evidence=eb.dataset.ev;S.seen.add(S.evidence);render();return}const b=event.target.closest('[data-action]');if(!b)return;const kind=b.dataset.action;if(kind==='back'){storeStage();S.stage=Math.max(0,S.stage-1);render();window.scrollTo({top:0,behavior:'instant'});return}if(kind==='next'){storeStage();const e=validate();if(e){document.getElementById('error').textContent=e;return}S.stage=Math.min(STAGES.length-1,S.stage+1);if(S.stage===2&&!S.seen.size)S.seen.add('layout');render();window.scrollTo({top:0,behavior:'instant'});return}if(kind==='reset'){if(confirm('Restart and clear your answers? Export first if needed.')){S.stage=0;S.student='';S.a={fault:'0'};S.seen.clear();S.evidence='layout';render();window.scrollTo(0,0)}return}if(kind==='export')download()});
document.addEventListener('input',e=>{if(e.target.name==='fault'){const p=Number(e.target.value);S.a.fault=String(p);document.getElementById('pv').textContent=p+'%';document.getElementById('sv').textContent=(100-p)+'%';document.getElementById('share').textContent=p+'%';document.getElementById('award').textContent=money(p>50?0:100000*(100-p)/100)}if(e.target.matches('textarea'))S.a[e.target.name]=e.target.value;if(e.target.name==='student')S.student=e.target.value});
document.addEventListener('change',e=>{if(e.target.matches('input[type="radio"],select'))S.a[e.target.name]=e.target.value});
render();
</script>
